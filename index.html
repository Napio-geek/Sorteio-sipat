<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio Eletrônico · SIPAT Atlântico 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --primary-teal: #007782;
  --dark-teal: #043947;
  --bg-dark: #021e26;
  --lime-green: #b8f51b;
  --lime-dark: #7fae12;
  --card-bg: #064556;
  --text-light: #f0f9fa;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family: 'Montserrat', sans-serif;
  background: var(--bg-dark);
  color: var(--text-light);
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.main-wrapper {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  position: relative;
  padding: 12px 16px;
  background: radial-gradient(circle at center, #075269 0%, #021e26 100%);
}

.header-bar {
  width: 100%;
  max-width: 1600px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px;
  background: rgba(4, 57, 71, 0.85);
  border: 1px solid rgba(184, 245, 27, 0.3);
  border-radius: 16px;
  backdrop-filter: blur(8px);
  gap: 10px;
  flex-wrap: wrap;
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-img {
  height: 42px;
  width: auto;
  object-fit: contain;
}

.sipat-title {
  display: flex;
  flex-direction: column;
}

.sipat-title h1 {
  font-size: 1.3rem;
  font-weight: 900;
  color: #fff;
  margin: 0;
  line-height: 1;
}

.sipat-title span {
  font-size: 0.7rem;
  color: var(--lime-green);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.config-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(2, 30, 38, 0.8);
  padding: 6px 12px;
  border-radius: 12px;
  border: 1px solid rgba(184, 245, 27, 0.4);
}

.config-box label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--lime-green);
}

.config-box input {
  width: 75px;
  background: #032b36;
  border: 1px solid var(--lime-green);
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 1rem;
  text-align: center;
  outline: none;
}

.stage {
  position: relative;
  width: min(100vw - 32px, 1500px);
  flex: 1;
  max-height: calc(100vh - 180px);
  aspect-ratio: 16/9;
  margin: 8px auto;
  background: url('visual_sipat.png') center/cover no-repeat;
  border-radius: 20px;
  border: 2px solid rgba(184, 245, 27, 0.4);
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.number-panel {
  width: min(70%, 550px);
  height: 44%;
  border-radius: 24px;
  background: rgba(3, 43, 54, 0.88);
  border: 3px solid var(--lime-green);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 0 20px rgba(184, 245, 27, 0.2);
  backdrop-filter: blur(6px);
  transition: all 0.3s ease;
}

.number-panel.spinning {
  border-color: #ffffff;
  background: rgba(9, 117, 155, 0.92);
}

.number-panel.winner {
  border-color: var(--lime-green);
  background: rgba(10, 132, 176, 0.95);
  box-shadow: 0 0 45px rgba(184, 245, 27, 0.7);
}

.number {
  font-weight: 900;
  font-size: clamp(48px, 9vw, 130px);
  line-height: 1;
  letter-spacing: .05em;
  color: #ffffff;
  text-shadow: 0 4px 12px rgba(0,0,0,0.6);
}

.status {
  font-size: clamp(10px, 1.1vw, 16px);
  letter-spacing: .2em;
  text-align: center;
  margin-top: 8px;
  color: var(--lime-green);
  font-weight: 800;
  text-transform: uppercase;
}

.draw-btn {
  margin-top: 18px;
  width: min(60%, 360px);
  height: 58px;
  border: 0;
  border-radius: 50px;
  background: var(--lime-green);
  color: #032b36;
  font-size: clamp(14px, 1.8vw, 22px);
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(184, 245, 27, 0.4);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 2;
}

.draw-btn:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(184, 245, 27, 0.7);
  background: #c7ff26;
}

.winner-banner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.85);
  opacity: 0;
  background: linear-gradient(135deg, #075b79, #021e26);
  border: 4px solid var(--lime-green);
  border-radius: 28px;
  padding: 30px 45px;
  text-align: center;
  z-index: 100;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(184, 245, 27, 0.5);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
}

.winner-banner.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}

.results {
  width: 100%;
  max-width: 1600px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: center;
}

.card {
  background: rgba(4, 57, 71, 0.85);
  border: 1px solid rgba(184, 245, 27, 0.2);
  border-radius: 14px;
  padding: 10px 18px;
  color: #fff;
  backdrop-filter: blur(6px);
}

.card h2 { font-size: 14px; margin: 0 0 6px; color: var(--lime-green); }
.history-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.history { display: flex; flex-wrap: wrap; gap: 6px; max-height: 48px; overflow-y: auto; }
.chip { background: var(--lime-green); border-radius: 6px; padding: 4px 8px; font-weight: 800; color: #032b36; font-size: 12px; }
.small { font-size: 11px; color: #a2cad3; line-height: 1.3; margin: 3px 0 0; }

.action {
  border: 0;
  background: #007782;
  color: white;
  border-radius: 6px;
  padding: 7px 12px;
  font-weight: 700;
  cursor: pointer;
  font-size: 12px;
}
.action:hover { background: #00565e; }
.action.reset { background: #a82e3e; }
.action.reset:hover { background: #852230; }
</style>
</head>
<body>
<div class="main-wrapper">
  <header class="header-bar">
    <div class="brand-area">
      <div class="sipat-title">
        <h1>SIPAT ATLÂNTICO 2026</h1>
        <span>Sorteio Eletrônico Oficial</span>
      </div>
    </div>
    <div class="config-box">
      <label for="totalParticipants">Total Participantes:</label>
      <input type="number" id="totalParticipants" value="150" min="1" max="9999" onchange="updateTotal(this.value)">
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="number-panel" id="numberPanel">
      <div class="number" id="number">---</div>
      <div class="status" id="status">PRONTO PARA O SORTEIO</div>
    </div>
    <button class="draw-btn" id="draw"><span>🎲</span> SORTEAR AGORA</button>
  </main>
</div>
</body>
</html>
