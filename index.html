<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio Eletrônico · SIPAT Atlântico 2026</title>

<style>
:root {
  --primary-teal: #007782;
  --dark-teal: #043947;
  --bg-dark: #021e26;
  --lime-green: #b8f51b;
  --text-light: #f0f9fa;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family: 'Montserrat', sans-serif;
  background: var(--bg-dark);
  color: var(--text-light);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.main-wrapper {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  position: relative;
  padding: 10px 16px;
  background: radial-gradient(circle at center, #075269 0%, #021e26 100%);
}

/* BARRA SUPERIOR */
.header-bar {
  width: 100%;
  max-width: 1500px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px;
  background: rgba(4, 57, 71, 0.85);
  border: 1px solid rgba(184, 245, 27, 0.3);
  border-radius: 12px;
  backdrop-filter: blur(8px);
  gap: 10px;
  flex-wrap: wrap;
  z-index: 20;
}

.brand-title h1 {
  font-size: 1.1rem;
  font-weight: 900;
  color: #fff;
  margin: 0;
  line-height: 1;
}

.brand-title span {
  font-size: 0.68rem;
  color: var(--lime-green);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.config-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(2, 30, 38, 0.8);
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px solid rgba(184, 245, 27, 0.4);
}

.config-box label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--lime-green);
}

.config-box input {
  width: 70px;
  background: #032b36;
  border: 1px solid var(--lime-green);
  color: #fff;
  padding: 3px 6px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 0.95rem;
  text-align: center;
  outline: none;
}

/* PALCO DO SORTEIO COM MANUTENÇÃO DE PROPORÇÃO 16:9 */
.stage-container {
  position: relative;
  width: min(100vw - 20px, calc((100vh - 160px) * (16 / 9)));
  aspect-ratio: 16 / 9;
  background: url('visual_sipat.png') center/contain no-repeat;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* PAINEL DE NÚMEROS */
.number-panel {
  position: absolute;
  top: 36.5%;
  left: 26.5%;
  width: 47%;
  height: 28%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  pointer-events: none;
}

.number {
  font-weight: 900;
  font-size: clamp(40px, 7vw, 110px);
  line-height: 1;
  letter-spacing: .05em;
  color: #ffffff;
  text-shadow: 0 4px 16px rgba(0,0,0,0.8);
}

.status {
  font-size: clamp(8px, 1vw, 14px);
  letter-spacing: .18em;
  text-align: center;
  margin-top: 4px;
  color: var(--lime-green);
  font-weight: 800;
  text-transform: uppercase;
}
