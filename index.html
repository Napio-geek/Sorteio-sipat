<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio Eletrônico · SIPAT Atlântico 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --primary-teal: #007782;
  --dark-teal: #043947;
  --bg-dark: #021e26;
  --lime-green: #b8f51b;
  --card-bg: #064556;
  --text-light: #f0f9fa;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family: 'Montserrat', sans-serif;
  background: var(--bg-dark);
  color: var(--text-light);
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.main-wrapper {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  position: relative;
  padding: 10px 16px;
  background: radial-gradient(circle at center, #075269 0%, #021e26 100%);
}

.header-bar {
  width: 100%;
  max-width: 1500px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px;
  background: rgba(4, 57, 71, 0.85);
  border: 1px solid rgba(184, 245, 27, 0.3);
  border-radius: 14px;
  backdrop-filter: blur(8px);
  gap: 10px;
  flex-wrap: wrap;
}

.brand-title h1 {
  font-size: 1.2rem;
  font-weight: 900;
  color: #fff;
  margin: 0;
  line-height: 1;
}

.brand-title span {
  font-size: 0.7rem;
  color: var(--lime-green);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.config-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(2, 30, 38, 0.8);
  padding: 6px 12px;
  border-radius: 10px;
  border: 1px solid rgba(184, 245, 27, 0.4);
}

.config-box label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--lime-green);
}

.config-box input {
  width: 75px;
  background: #032b36;
  border: 1px solid var(--lime-green);
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 1rem;
  text-align: center;
  outline: none;
}

/* PALCO DO SORTEIO INTEGRADO COM A ARTE */
.stage {
  position: relative;
  width: min(100vw - 20px, 1400px);
  flex: 1;
  max-height: calc(100vh - 170px);
  aspect-ratio: 16/9;
  margin: 6px auto;
  background: url('visual_sipat.png') center/contain no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* PAINEL DE NÚMEROS ENCAIXADO NO CARTÃO ESCURO DA IMAGEM */
.number-panel {
  position: absolute;
  top: 36.5%;
  left: 26.5%;
  width: 47%;
  height: 28%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  border-radius: 24px;
  transition: all 0.25s ease;
}

.number {
  font-weight: 900;
  font-size: clamp(40px, 7.5vw, 120px);
  line-height: 1;
  letter-spacing: .05em;
  color: #ffffff;
  text-shadow: 0 4px 15px rgba(0,0,0,0.7);
}

.status {
  font-size: clamp(9px, 0.9vw, 14px);
  letter-spacing: .18em;
  text-align: center;
  margin-top: 4px;
  color: var(--lime-green);
  font-weight: 800;
  text-transform: uppercase;
}

/* BOTÃO ENCAIXADO EXATAMENTE NO BOTÃO DA ARTE DE FUNDO */
.draw-btn {
  position: absolute;
  top: 68%;
  left: 33.5%;
  width: 33%;
  height: 10.5%;
  border: 0;
  border-radius: 50px;
  background: transparent;
  color: #032b36;
  font-size: clamp(13px, 1.5vw, 20px);
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s ease;
}

.draw-btn:hover:not(:disabled) {
  transform: scale(1.02);
}

.draw-btn:disabled {
  opacity: .5;
  cursor: wait;
}

.winner-banner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.85);
  opacity: 0;
  background: linear-gradient(135deg, #075b79, #021e26);
  border: 4px solid var(--lime-green);
  border-radius: 24px;
  padding: 24px 38px;
  text-align: center;
  z-index: 100;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(184, 245, 27, 0.5);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
}

.winner-banner.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}

.winner-banner h1 {
  font-size: clamp(20px, 3vw, 34px);
  color: var(--lime-green);
  margin: 0 0 4px;
  font-weight: 900;
}

.winner-banner .winner-num {
  font-size: clamp(50px, 8vw, 100px);
  font-weight: 900;
  color: #ffffff;
  margin: 6px 0;
  text-shadow: 0 0 20px var(--lime-green);
}

.winner-banner p {
  font-size: clamp(12px, 1.4vw, 18px);
  color: #e5f8fb;
  margin: 0 0 14px;
  font-weight: 700;
}

.close-banner-btn {
  background: var(--lime-green);
  color: #032b36;
  border: 0;
  padding: 8px 24px;
  font-size: 15px;
  font-weight: 900;
  border-radius: 50px;
  cursor: pointer;
}

.results {
  width: 100%;
  max-width: 1500px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}

.card {
  background: rgba(4, 57, 71, 0.85);
  border: 1px solid rgba(184, 245, 27, 0.2);
  border-radius: 12px;
  padding: 8px 14px;
  color: #fff;
  backdrop-filter: blur(6px);
}

.card h2 { font-size: 13px; margin: 0 0 4px; color: var(--lime-green); }
.history-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.history { display: flex; flex-wrap: wrap; gap: 6px; max-height: 42px; overflow-y: auto; }
.chip { background: var(--lime-green); border-radius: 6px; padding: 3px 7px; font-weight: 800; color: #032b36; font-size: 11px; }
.small { font-size: 11px; color: #a2cad3; }

.action {
  border: 0;
  background: #007782;
  color: white;
  border-radius: 6px;
  padding: 6px 10px;
  font-weight: 700;
  cursor: pointer;
  font-size: 11px;
}
.action.reset { background: #a82e3e; }

@media(max-width: 768px){
  .header-bar { flex-direction: column; text-align: center; }
  .results { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="main-wrapper">

  <header class="header-bar">
    <div class="brand-title">
      <h1>SIPAT ATLÂNTICO 2026</h1>
      <span>Sorteio Eletrônico Dinâmico</span>
    </div>
    <div class="config-box">
      <label for="totalParticipants">Total de Participantes:</label>
      <input type="number" id="totalParticipants" value="150" min="1" max="9999" onchange="updateTotal(this.value)">
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="number-panel" id="numberPanel">
      <div class="number" id="number">---</div>
      <div class="status" id="status">PRONTO PARA O SORTEIO</div>
    </div>
    
    <button class="draw-btn" id="draw"></button>

    <div class="winner-banner" id="winnerBanner">
      <h1>🎉 PARABÉNS! 🎉</h1>
      <p>VOCÊ GANHOU!</p>
      <div class="winner-num" id="winnerNumDisplay">000</div>
      <button class="close-banner-btn" onclick="closeBanner()">Continuar</button>
    </div>
  </main>

  <footer class="results">
    <div class="card">
      <div class="history-head">
        <h2>🏆 Histórico de Ganhadores <span class="small" id="count">(0 prêmios)</span></h2>
        <button class="action reset" id="reset">Resetar sorteio</button>
      </div>
      <div class="history" id="history"><span class="small">Os números sorteados aparecerão aqui.</span></div>
    </div>
    <div class="card" style="display: flex; gap: 8px; align-items: center; justify-content: center;">
      <button class="action" id="export">Exportar CSV</button>
      <span class="small">Modo Telão: <strong>F11</strong></span>
    </div>
  </footer>

</div>

<script>
(()=>{
  const KEY='sipat-atlantico-2026-dinamico';
  let state;
  try{ 
    state=JSON.parse(localStorage.getItem(KEY))||{total:150, winners:[]} 
  }catch{ 
    state={total:150, winners:[]} 
  }
  if(typeof state.total !== 'number' || state.total < 1) state.total = 150;
  if(!Array.isArray(state.winners)) state.winners = [];

  document.getElementById('totalParticipants').value = state.total;

  const $=x=>document.getElementById(x);
  
  const pad=(n)=>{
    let maxDigits = String(state.total).length;
    if(maxDigits < 3) maxDigits = 3;
    return String(n).padStart(maxDigits,'0');
  };

  const pool=()=>Array.from({length:state.total},(_,i)=>i+1).filter(n=>!state.winners.some(w=>w.number===n));

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if(!audioCtx) audioCtx = new AudioCtx();
  }

  function playDrumRoll(durationMs) {
    initAudio();
    if(!audioCtx) return;
    const startTime = audioCtx.currentTime;
    const interval = 0.08;
    const totalBeats = Math.floor((durationMs / 1000) / interval);

    for(let i=0; i<totalBeats; i++) {
      const time = startTime + (i * interval);
      const bufferSize = audioCtx.sampleRate * 0.05;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let j = 0; j < bufferSize; j++) { data[j] = Math.random() * 2 - 1; }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1000 + (i * 20);

      const gain = audioCtx.createGain();
      const volume = 0.2 + (i / totalBeats) * 0.5;
      gain.gain.setValueAtTime(volume, time);
      gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(time);
    }
  }

  function playFanfare() {
    initAudio();
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [
      { freq: 523.25, time: 0, duration: 0.15 },
      { freq: 659.25, time: 0.15, duration: 0.15 },
      { freq: 783.99, time: 0.30, duration: 0.15 },
      { freq: 1046.50, time: 0.45, duration: 0.6 }
    ];

    notes.forEach(note => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(note.freq, now + note.time);
      gain.gain.setValueAtTime(0.5, now + note.time);
      gain.gain.exponentialRampToValueAtTime(0.001, now + note.time + note.duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + note.time);
      osc.stop(now + note.time + note.duration);
    });
  }

  function save(){ localStorage.setItem(KEY,JSON.stringify(state)) }

  window.updateTotal = function(val) {
    let num = parseInt(val);
    if(isNaN(num) || num < 1) {
      num = 150;
      $('totalParticipants').value = 150;
    }
    if(state.winners.length > 0) {
      if(!confirm('Mudar o total de participantes irá reiniciar o histórico atual de sorteios para este novo limite de '+num+'. Deseja continuar?')) {
        $('totalParticipants').value = state.total;
        return;
      }
      state.winners = [];
    }
    state.total = num;
    save();
    $('number').textContent = '---';$('status').textContent = 'PRONTO PARA O SORTEIO';
    render();
  }

  function render(){
    $('count').textContent=`(${state.winners.length} prêmios)`;
    $('history').innerHTML=state.winners.length?
      state.winners.map((w,i)=>`<span class="chip">Prêmio ${i+1}: ${pad(w.number)}</span>`).join(''):
      '<span class="small">Os números sorteados aparecerão aqui.</span>';
    $('draw').disabled=pool().length===0;
  }

  window.closeBanner = function() {
    $('winnerBanner').classList.remove('show');
  }

  $('draw').addEventListener('click', ()=>{
    let candidates = pool();
    if(!candidates.length) return alert('Todos os números já foram sorteados para este total de participantes!');

    initAudio();
    $('draw').disabled = true;
    $('status').textContent = 'SORTEANDO...';$('winnerBanner').classList.remove('show');

    const totalSteps = 35;
    const duration = totalSteps * 85;

    playDrumRoll(duration);

    let step = 0;
    const timer = setInterval(() => {
      const randomCandidate = candidates[Math.floor(Math.random() * candidates.length)];
      $('number').textContent = pad(randomCandidate);
      step++;

      if(step >= totalSteps) {
        clearInterval(timer);
        candidates = pool();
        const winner = candidates[Math.floor(Math.random() * candidates.length)];
        
        state.winners.unshift({ number: winner, time: new Date().toLocaleString('pt-BR') });
        save();

        $('number').textContent = pad(winner);$('status').textContent = 'NÚMERO SORTEADO!';

        playFanfare();

        $('winnerNumDisplay').textContent = pad(winner);
        setTimeout(() => {
          $('winnerBanner').classList.add('show');
          if (typeof confetti === 'function') {
            confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
          }
        }, 300);

        render();
      }
    }, 85);
  });

  $('export').addEventListener('click', ()=>{
    const rows = [['Premio','Numero','Data e hora'], ...state.winners.map((w,i)=>[state.winners.length-i, pad(w.number), w.time])];
    const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'ganhadores-sipat-atlantico.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('reset').addEventListener('click', ()=>{
    if(confirm('ATENÇÃO: apagar o histórico e liberar novamente todos os números de 1 a '+state.total+'?')){
      state.winners=[];
      save();
      $('number').textContent='---';
      $('status').textContent='PRONTO PARA O SORTEIO';$('winnerBanner').classList.remove('show');
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
